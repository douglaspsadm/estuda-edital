<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Plataforma adaptativa multi-concurso: suba seu Edital, aproveite questões reais da base comum ou importe suas provas, registre erros e gere aulas cirúrgicas com IA BYOK." />
  <title>Estuda Edital — Plataforma Adaptativa Multi-Concurso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0c0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Estuda Edital" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
</head>
<body>

  <!-- OVERLAY MOBILE DRAWER -->
  <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="closeMobileMenu()"></div>

  <!-- BARRA LATERAL (SIDEBAR / MOBILE DRAWER) -->
  <aside id="app-sidebar" class="sidebar" aria-label="Menu principal">
    <div class="brand">
      <img src="icons/icon-192.png" alt="Estuda Edital" class="brand-badge brand-logo-img" onerror="this.style.display='none'" />
      <div class="brand-text">
        <h1 id="brand-title">Estuda Edital</h1>
        <span id="brand-subtitle">Plataforma Multi-Concurso</span>
      </div>
      <button class="icon-btn mobile-only" onclick="closeMobileMenu()" aria-label="Fechar menu">✕</button>
    </div>

    <!-- SELETOR DE TRILHA / CONCURSO E CARGO -->
    <div class="track-switcher">
      <label class="track-switcher-label" for="track-select">Concurso / Trilha Ativa</label>
      <select id="track-select" class="form-control track-select" onchange="onConcursoSelectChange(this.value)"></select>
      <div id="role-select-wrapper" style="display:none; margin-top:6px;">
        <label class="track-switcher-label" for="role-select">Cargo / Especialidade</label>
        <select id="role-select" class="form-control track-select" onchange="switchTrack(this.value)"></select>
      </div>
      <div style="display:flex; gap:6px; margin-top:8px;">
        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="window.OnboardingWizard && OnboardingWizard.open(1, 'custom')">
          + Concurso
        </button>
        <button class="btn btn-outline btn-sm" id="btn-upload-exams" style="flex:1;" onclick="switchView('import')">
          Subir provas
        </button>
      </div>
    </div>

    <div class="countdown-chip" id="countdown-chip">
      <span class="cd-label" id="countdown-label">Data da Prova</span>
      <strong class="cd-days" id="countdown-days">--</strong>
    </div>

    <nav class="nav-scroll">
      <ul class="nav-menu">
        <li class="nav-section-title">Estudo Diário</li>
        <li class="nav-item">
          <button class="nav-btn active" data-view="dashboard" onclick="switchView('dashboard')">
            <span>Início</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-view="diagnostic" onclick="switchView('diagnostic')">
            <span>Questões</span>
            <span class="nav-badge" id="badge-questions-count">0/0</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-view="errors" onclick="switchView('errors')">
            <span>Caderno de Erros</span>
            <span class="nav-badge" id="badge-errors-count">0</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-view="remediation" onclick="switchView('remediation')">
            <span>Aulas &amp; Reforço</span>
            <span class="nav-badge" id="badge-weak-count">0</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-view="review" onclick="switchView('review')">
            <span>Revisão do Dia</span>
            <span class="nav-badge" id="badge-review">0</span>
          </button>
        </li>

        <li class="nav-section-title">Treino de Prova</li>
        <li class="nav-item">
          <button class="nav-btn" data-view="simulado" onclick="switchView('simulado')">
            <span>Simulado</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-view="discursive" onclick="switchView('discursive')">
            <span>Discursiva</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-view="flashcards" onclick="switchView('flashcards')">
            <span>Flashcards</span>
          </button>
        </li>

        <li class="nav-section-title">Edital, Provas &amp; Dados</li>
        <li class="nav-item">
          <button class="nav-btn" data-view="import" onclick="switchView('import')">
            <span>Importar Provas</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-view="edital" onclick="switchView('edital')">
            <span>Edital Verticalizado</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-view="handoff" onclick="switchView('handoff')">
            <span>Dados, Backup &amp; IA</span>
          </button>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-outline btn-sm" data-pwa-install-btn style="width:100%;" onclick="window.PWAInstall && PWAInstall.promptInstall()" title="Instalar Estuda Edital como aplicativo no celular ou PC">
        Instalar aplicativo
      </button>
      <div class="sidebar-footer-row">
        <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="exportProgressJson()" title="Baixar backup do progresso">
          Backup
        </button>
        <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="triggerImportBackup()" title="Restaurar backup JSON">
          Restaurar
        </button>
      </div>
      <input type="file" id="import-json-input" accept=".json" style="display:none;" onchange="importProgressJsonFile(event)" />
      <div id="save-status-indicator" class="save-indicator">
        <span class="save-dot"></span> Salvo no navegador
      </div>
    </div>
  </aside>

  <!-- ÁREA PRINCIPAL -->
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn mobile-only" onclick="openMobileMenu()" aria-label="Abrir menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar-title" id="topbar-view-title">Visão Geral</span>
      </div>
      <div class="topbar-actions">
        <button id="topbar-cloud-btn" class="btn btn-outline btn-sm" onclick="window.CloudSync && CloudSync.openAuthModal()" title="Entrar para sincronizar progresso na nuvem">
          Entrar
        </button>
        <button class="icon-btn" style="display:inline-flex;" onclick="toggleTheme()" title="Alternar tema claro/escuro" aria-label="Alternar tema">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </header>

    <main class="content-area">
      <!-- 1. DASHBOARD -->
      <section id="view-dashboard" class="view-section active">
        <div id="dashboard-content"></div>
      </section>

      <!-- 2. QUESTÕES -->
      <section id="view-diagnostic" class="view-section">
        <div id="diagnostic-content"></div>
      </section>

      <!-- 3. CADERNO DE ERROS -->
      <section id="view-errors" class="view-section">
        <div id="errors-content"></div>
      </section>

      <!-- 4. AULAS E REFORÇO -->
      <section id="view-remediation" class="view-section">
        <div id="remediation-content"></div>
      </section>

      <!-- 5. REVISÃO DO DIA -->
      <section id="view-review" class="view-section">
        <div id="review-content"></div>
      </section>

      <!-- 6. SIMULADO -->
      <section id="view-simulado" class="view-section">
        <div id="simulado-content"></div>
      </section>

      <!-- 7. PROVA DISCURSIVA -->
      <section id="view-discursive" class="view-section">
        <div id="discursive-content"></div>
      </section>

      <!-- 8. FLASHCARDS -->
      <section id="view-flashcards" class="view-section">
        <div id="flashcards-content"></div>
      </section>

      <!-- 9. IMPORTAR PROVAS & BASE COMUM -->
      <section id="view-import" class="view-section">
        <div id="import-content"></div>
      </section>

      <!-- 10. EDITAL VERTICALIZADO -->
      <section id="view-edital" class="view-section">
        <div id="edital-content"></div>
      </section>

      <!-- 11. DADOS, BACKUP & GOVERNANÇA -->
      <section id="view-handoff" class="view-section">
        <div id="handoff-content"></div>
      </section>
    </main>
  </div>

  <!-- BARRA INFERIOR MOBILE (ERGONOMIA MOBILE-FIRST) -->
  <nav class="bottom-nav mobile-only" aria-label="Navegação rápida">
    <button class="bnav-btn active" data-view="dashboard" onclick="switchView('dashboard')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Início</span>
    </button>
    <button class="bnav-btn" data-view="diagnostic" onclick="switchView('diagnostic')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Questões</span>
    </button>
    <button class="bnav-btn" data-view="errors" onclick="switchView('errors')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>Erros</span>
    </button>
    <button class="bnav-btn" data-view="import" onclick="switchView('import')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>Provas</span>
    </button>
    <button class="bnav-btn" onclick="openMobileMenu()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <span>Menu</span>
    </button>
  </nav>

  <!-- SCRIPTS DE DADOS E MOTOR MULTI-CONCURSO -->
  <script src="data/dpdf_edital_data.js"></script>
  <script src="data/dpdf_questions_reais.js"></script>
  <script src="data/dpdf_lessons_data.js"></script>
  <script src="data/dpdf_discursive_data.js"></script>
  <script src="data/cofen_edital_data.js"></script>
  <script src="data/quadrix_questions.js"></script>
  <script src="data/shared_bank.js"></script>
  <script src="js/tracks_manager.js"></script>
  <script src="js/ai_tutor.js"></script>
  <script src="js/pdf_importer.js"></script>
  <script src="js/onboarding_wizard.js"></script>
  <script src="js/supabase_env.js"></script>
  <script src="js/cloud_sync.js"></script>
  <script src="js/pwa_install.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
